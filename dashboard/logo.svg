<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="crux logo">
  <!-- crux mark: heatmap bars with an amber peak marker over the tallest. -->
  <!-- Swap .crux-badge fill in CSS to change background for light mode. -->
  <defs>
    <linearGradient id="cruxAccent" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#339af0"/>
      <stop offset="1"   stop-color="#4dabf7"/>
    </linearGradient>
    <linearGradient id="cruxPeak" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0"   stop-color="#f59f00"/>
      <stop offset="1"   stop-color="#ffd43b"/>
    </linearGradient>
    <filter id="cruxGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded-square badge -->
  <rect class="crux-badge" x="4" y="4" width="88" height="88" rx="18" ry="18"
        fill="#171b21"/>

  <!-- Heatmap bars: 11 bars, symmetric peak in the middle-right.
       Heights are hand-tuned so the silhouette clearly "spikes" without
       looking like a bar chart. -->
  <g fill="url(#cruxAccent)">
    <rect x="12" y="60" width="6" height="18" rx="1.5"/>
    <rect x="20" y="54" width="6" height="24" rx="1.5"/>
    <rect x="28" y="50" width="6" height="28" rx="1.5"/>
    <rect x="36" y="42" width="6" height="36" rx="1.5"/>
    <rect x="44" y="36" width="6" height="42" rx="1.5"/>
    <!-- the peak bar -->
    <rect x="52" y="22" width="6" height="56" rx="1.5" fill="url(#cruxPeak)"
          filter="url(#cruxGlow)"/>
    <rect x="60" y="38" width="6" height="40" rx="1.5"/>
    <rect x="68" y="46" width="6" height="32" rx="1.5"/>
    <rect x="76" y="54" width="6" height="24" rx="1.5"/>
  </g>

  <!-- Peak marker: a small ring + dot above the peak bar -->
  <g transform="translate(55 16)">
    <circle r="4.5" fill="none" stroke="#f59f00" stroke-width="1.6"/>
    <circle r="1.6" fill="#ffd43b"/>
  </g>

  <!-- Baseline underscore -->
  <rect x="12" y="80" width="70" height="1.8" rx="0.9" fill="#2a2f39"/>
</svg>
